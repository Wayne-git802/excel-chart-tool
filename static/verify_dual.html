<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>Dual Y Axis Verification</title>
<script src="/static/js/echarts.min.js"></script>
<style>
body { margin: 0; padding: 20px; background: #0a0f1e; color: #e2e8f0; font-family: sans-serif; }
#chartContainer { width: 100%; height: 520px; }
.info { margin-bottom: 10px; padding: 8px 16px; background: rgba(255,255,255,0.05); border-radius: 8px; }
</style>
</head>
<body>
<h2>Dual Y Axis Verification</h2>
<div class="info" id="info">Loading...</div>
<div id="chartContainer"></div>

<script>
// Same ChartRenderer as in index.html
window.ChartRenderer = {
    _instance: null,
    _containerId: 'chartContainer',
    _currentSpec: null,

    render: function(spec, theme) {
        var el = document.getElementById(this._containerId);
        if (!el) return;
        el.style.display = 'block';
        
        if (spec._html) {
            this.destroy();
            el.innerHTML = spec._html;
            var scripts = el.querySelectorAll('script');
            for (var i = 0; i < scripts.length; i++) {
                var s = scripts[i];
                var newScript = document.createElement('script');
                newScript.textContent = s.textContent;
                s.parentNode.replaceChild(newScript, s);
            }
            return;
        }
        
        el.innerHTML = '';
        var themeName = (theme === 'dark') ? 'dark' : undefined;
        if (this._instance) {
            this._instance.setOption(spec, { notMerge: true });
        } else {
            this._instance = echarts.init(el, themeName);
            this._instance.setOption(spec);
        }
        this._currentSpec = spec;
        window.addEventListener('resize', function() {
            if (self._instance) self._instance.resize();
        });
    },
    
    destroy: function() {
        if (this._instance) { this._instance.dispose(); this._instance = null; }
    }
};

// Load spec and render
fetch('/static/_verify_dual.json')
.then(function(r) { return r.json(); })
.then(function(spec) {
    var info = 'yAxis count: ' + (spec.yAxis || []).length;
    spec.yAxis.forEach(function(a, i) {
        info += '<br>  yAxis[' + i + ']: ' + (a.name || '?') + ' @ ' + (a.position || 'left');
    });
    info += '<br>series count: ' + (spec.series || []).length;
    spec.series.forEach(function(s, i) {
        info += '<br>  series[' + i + ']: ' + s.name + ' → yAxisIndex=' + (s.yAxisIndex || 0);
    });
    document.getElementById('info').innerHTML = info;
    
    ChartRenderer.render(spec, 'dark');
    
    // Verify after render
    setTimeout(function() {
        var option = ChartRenderer._instance.getOption();
        var renderedYAxes = option.yAxis.length;
        var hasRight = option.yAxis.some(function(a) { return a.position === 'right'; });
        document.getElementById('info').innerHTML += 
            '<br><br>✅ RENDERED: ' + renderedYAxes + ' yAxes, right axis: ' + (hasRight ? 'YES ✅' : 'NO ❌');
    }, 500);
});
</script>
</body>
</html>
